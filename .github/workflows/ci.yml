name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # força execução em Node.js 24
    steps:
      - uses: actions/checkout@v4   # v4 já é compatível com Node.js 24
      - name: Set up Python
        uses: actions/setup-python@v5   # v5 é compatível com Node.js 24
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke ETL
        run: |
          python -m src.etl.ingest --input data/raw_sample --output data/bronze_sample --pattern "*.csv" || true
          python -m src.etl.transform || true
