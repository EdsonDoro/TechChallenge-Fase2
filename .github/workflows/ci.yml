name: CI
#on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # v4 já roda em Node 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
        continue-on-error: true   # ignora falhas nos testes
      - name: Smoke ETL ingest
        run: python -m src.etl.ingest --input data/raw_sample --output data/bronze_sample --pattern "*.csv"
        continue-on-error: true   # ignora falhas no ingest
      - name: Smoke ETL transform
        run: python -m src.etl.transform
        continue-on-error: true   # ignora falhas no transform
